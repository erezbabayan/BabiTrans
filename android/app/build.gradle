plugins { id 'com.android.application' }
def ksProps = new Properties()
def ksFile = file(System.getenv('BABITRANS_KEYSTORE_PROPS') ?: '/workspace/secrets/babitrans-android/keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
android {
    namespace 'com.erezbabayan.babitrans'
    compileSdk 34
    defaultConfig { applicationId 'com.erezbabayan.babitrans'; minSdk 26; targetSdk 34; versionCode 8; versionName '0.3.5'
        ndk { abiFilters(*((project.findProperty('abis') ?: 'arm64-v8a').toString().split(','))) }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', "-DWHISPER_SRC=${System.getenv('WHISPER_SRC') ?: ''}" } } }
    ndkVersion '26.3.11579264'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    signingConfigs { release { if (ksFile.exists()) {
        storeFile file(ksProps['storeFile']); storePassword ksProps['storePassword']
        keyAlias ksProps['keyAlias']; keyPassword ksProps['keyPassword'] } } }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
